services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: seismo_teaching
      POSTGRES_USER: seismo
      POSTGRES_PASSWORD: seismo
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seismo -d seismo_teaching"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://seismo:seismo@db:5432/seismo_teaching
      SAMPLE_DIR: /app/sample_data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - sample-data:/app/sample_data

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgis-data:
  sample-data:
